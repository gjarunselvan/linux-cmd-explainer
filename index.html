<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Linux Command Explainer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --border: #1e2d40;
      --green: #00ff9d;
      --green-dim: #00ff9d22;
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #38bdf8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,157,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,157,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
    }

    header {
      margin-bottom: 3rem;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--green);
      border: 1px solid var(--green);
      padding: 3px 10px;
      border-radius: 2px;
      margin-bottom: 1.2rem;
      letter-spacing: 0.1em;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    h1 span { color: var(--green); }

    .subtitle {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .input-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--green);
      letter-spacing: 0.1em;
      margin-bottom: 10px;
      display: block;
    }

    textarea, input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }

    textarea:focus, input[type="text"]:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-dim);
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .example-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid #00ff9d44;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .example-btn:hover { background: #00ff9d33; }

    .run-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 14px;
      background: var(--green);
      color: #0a0e1a;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.1s;
    }

    .run-btn:hover { opacity: 0.9; }
    .run-btn:active { transform: scale(0.99); }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .output-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 1.5rem;
      border-bottom: 1px solid var(--border);
      background: #0d1520;
    }

    .output-header span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--green);
      letter-spacing: 0.1em;
    }

    .copy-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .copy-btn:hover { color: var(--text); border-color: var(--muted); }

    #output-text {
      padding: 1.5rem;
      font-size: 15px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      min-height: 100px;
    }

    .loading {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 14px;
      font-family: 'JetBrains Mono', monospace;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="grid-bg"></div>

<div class="wrapper">
  <header>
    <div class="badge">$ linux --explainer v1.0</div>
    <h1>Linux Command<br/><span>Explainer</span></h1>
    <p class="subtitle">Paste any command. Understand every part of it instantly.</p>
  </header>

  <div class="card">
    <label class="input-label">// ENTER COMMAND</label>
    <input type="text" id="cmd-input" placeholder="e.g. awk '{print $1}' /var/log/auth.log | sort -u" />
    <div class="examples">
      <button class="example-btn" onclick="setCmd(`find / -name '*.log' -mtime -7 -exec ls -lh {} \\;`)">find logs</button>
      <button class="example-btn" onclick="setCmd(`ps aux | grep nginx | awk '{print $2}' | xargs kill -9`)">kill process</button>
      <button class="example-btn" onclick="setCmd(`tar -czf backup.tar.gz /var/www/html`)">tar backup</button>
      <button class="example-btn" onclick="setCmd(`netstat -tulnp | grep LISTEN`)">open ports</button>
      <button class="example-btn" onclick="setCmd(`df -h | awk 'NR>1 {print $5, $6}' | sort -rn`)">disk usage</button>
      <button class="example-btn" onclick="setCmd(`sed -i 's/old_text/new_text/g' config.yml`)">sed replace</button>
    </div>
    <button class="run-btn" id="run-btn" onclick="explain()">Explain this command →</button>
  </div>

  <div class="output-card" id="output-card">
    <div class="output-header">
      <span>// EXPLANATION</span>
      <button class="copy-btn" onclick="copyOutput()">copy</button>
    </div>
    <div class="loading" id="loading">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <span>analyzing command...</span>
    </div>
    <div id="output-text"></div>
  </div>

  <footer>built by gjarunselvan · powered by claude ai</footer>
</div>

<script>
function setCmd(cmd) {
  document.getElementById('cmd-input').value = cmd;
  document.getElementById('cmd-input').focus();
}

async function explain() {
  const cmd = document.getElementById('cmd-input').value.trim();
  if (!cmd) return;

  const card = document.getElementById('output-card');
  const loading = document.getElementById('loading');
  const output = document.getElementById('output-text');
  const btn = document.getElementById('run-btn');

  card.style.display = 'block';
  loading.style.display = 'flex';
  output.textContent = '';
  btn.disabled = true;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: `You are a Linux expert and teacher. Explain this Linux command clearly:

${cmd}

Format your response like this:
📌 WHAT IT DOES
One sentence summary of what this command achieves.

🔍 BREAKDOWN
Explain each part/flag of the command one by one.

⚠️ WATCH OUT
Any gotchas, risks, or things to be careful about.

💡 PRO TIP
A practical tip or common variation of this command.

Be concise and practical. Use simple English — no jargon.`
        }]
      })
    });

    const data = await res.json();
    const text = data.content?.[0]?.text;
    if (text) {
      output.textContent = text;
    } else {
      output.textContent = 'Something went wrong. Try again.';
    }
  } catch (e) {
    output.textContent = 'Error connecting. Please try again.';
  } finally {
    loading.style.display = 'none';
    btn.disabled = false;
  }
}

function copyOutput() {
  const text = document.getElementById('output-text').textContent;
  navigator.clipboard.writeText(text);
}

document.getElementById('cmd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') explain();
});
</script>
</body>
</html>
